name: Build

env:
  # Compile in parallel where possible.
  CL: /MP

  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        type: choice
        options: [gta-reversed, ultimate-living-world]
        default: gta-reversed

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'gta-reversed') ||
          (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/ulw/')) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026]
        arch: [x86]
        # The manual run produces one ready-to-install build.
        conf: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["Release"]' || '["Debug", "Release"]') }}
        unity: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["Unity"]' || '["Unity", "NoUnity"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and build project using Conan
        uses: ./.github/actions/conan
        with:
          arch: ${{ matrix.arch }}
          conf: ${{ matrix.conf }}
          unity_build: ${{ matrix.unity == 'Unity' && 'true' || 'false' }}
          build: true

      - name: Verify the ASI was built
        shell: pwsh
        run: |
          $asiPath = 'bin/${{ matrix.conf }}/gta_reversed.asi'
          $asi = Get-Item -LiteralPath $asiPath -ErrorAction Stop
          if ($asi.PSIsContainer -or $asi.Length -eq 0) {
            throw "Expected a non-empty ASI file at $asiPath."
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gta_reversed-${{ matrix.conf }}-${{ matrix.unity }}
          path: ${{ github.event_name == 'workflow_dispatch' && 'bin/Release/gta_reversed.asi' || format('bin/{0}', matrix.conf) }}
          if-no-files-found: error

  ultimate-living-world:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'ultimate-living-world') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ulw/')) ||
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'ulw/')) }}
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build x86 ASI and run tests
        shell: cmd
        env:
          CL: ''
        run: ulw\build.cmd
      - name: Upload Ultimate Living World
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UltimateLivingWorld
          path: bin/ulw/dist
          if-no-files-found: error
